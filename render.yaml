services:
  - type: web
    name: bpms-portal
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn supplierportal.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: supplierportal.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
